x-logging: &logging
  logging:
    driver: loki
    options:
      loki-url: "http://193.26.158.2:3100/loki/api/v1/push"
      loki-batch-size: "400"
      loki-external-labels: "chain=mainnet,type=trace-collector"

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.traces
    image: colibri/trace-collector:latest
    container_name: trace-collector
    restart: unless-stopped

    # geth laeuft auf diesem Host im host-mode (RPC lokal auf 127.0.0.1:8545).
    # Der Collector deshalb ebenfalls host-mode: erreicht localhost:8545 direkt und
    # umgeht die Bridge-/ufw-Problematik (eine Bridge-IP waere nicht in der Allowlist).
    network_mode: host

    <<: *logging

    environment:
      RPC: "http://127.0.0.1:8545" # geth mit eth + debug Namespace, Full-Node im Fenster
      OUT: "/data/traces"
      CAP: "5"
      POLL_MS: "12000"
      MAX_LAG: "100" # < 128 (Full-Node-State-Fenster)
      TRACE_TIMEOUT: "60s" # gilt pro Tx
      INCLUDE_RECEIPTS: "true"
      CHAIN: "mainnet" # label on all metrics; also part of the prom filename
      # One file PER chain: two collectors writing the same file would overwrite
      # each other. The chain label keeps the series apart in Prometheus.
      PROM_FILE: "/metrics/trace_collector_mainnet.prom"

    volumes:
      # Ziel auf der frisch aufgeraeumten grossen Platte.
      # Einmalig anlegen + Owner setzen (Container laeuft als uid 1000):
      #   sudo mkdir -p /srv/trace-data && sudo chown -R 1000:1000 /srv/trace-data
      - /srv/trace-data:/data/traces
      # node_exporter textfile_collector directory (host path must match the
      # --collector.textfile.directory flag of node_exporter). The container
      # runs as uid 1000, so the directory must be writable for it:
      #   sudo mkdir -p /srv/node_exporter/textfile && sudo chown 1000:1000 /srv/node_exporter/textfile
      - /srv/node_exporter/textfile:/metrics

    # Container selbst ist leichtgewichtig – die Trace-Last traegt geth, nicht dieser Prozess.
    mem_limit: 512m

  # Batch-Aufbereitung: _sim.json + _prompt.json aus den Collector-Traces.
  # Eigenes Image: git/npm/solc + Sourcify. Nicht in den Collector mischen
  # (anderer Lifecycle, mehr RAM, braucht ausgehendes HTTPS).
  prepare:
    build:
      context: .
      dockerfile: Dockerfile.prepare
      args:
        # Branch/Tag von https://github.com/corpus-core/colibri-stateless
        # (Explainer ist noch nicht auf npm. Lokale uncommittete Aenderungen
        # sind erst nach Push auf diesen Ref im Image.)
        COLIBRI_REF: dev
    image: colibri/trace-prepare:latest
    container_name: trace-prepare
    restart: unless-stopped

    # Sourcify + colibri-RPC brauchen ausgehendes HTTPS; Bridge reicht.
    # network_mode: host nur, wenn RPC auf 127.0.0.1:8545 zeigen soll.

    logging:
      driver: loki
      options:
        loki-url: "http://193.26.158.2:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-external-labels: "chain=mainnet,type=trace-prepare"

    environment:
      IN: "/data/traces"
      C4_STATE_DIR: "/data/cache"
      RPC: "https://mainnet1.colibri-proof.tech/execution"
      CHAIN_ID: "1"
      STEPS: "1,2a,2b"
      CONCURRENCY: "2"
      INTERVAL_S: "300"
      EXPLAINER_DIR: "/opt/explainer"
      SKIP_EXPLAINER_BUILD: "1"
      NODE_OPTIONS: "--max-old-space-size=3072"
      CHAIN: "mainnet"
      # Own file: collector and prepare must not share a .prom (last writer wins).
      PROM_FILE: "/metrics/trace_prepare_mainnet.prom"

    volumes:
      - /srv/trace-data:/data/traces
      # Sourcify/solc-Cache; einmalig:
      #   sudo mkdir -p /srv/trace-cache && sudo chown 1000:1000 /srv/trace-cache
      - /srv/trace-cache:/data/cache
      - /srv/node_exporter/textfile:/metrics

    mem_limit: 4g

  # One-shot keep-set: cluster prompts by (method × Solidity interface) and
  # copy at most CAP files per cluster to OUT. Does not start with `up`.
  #   docker compose --profile dedup run --rm dedup
  dedup:
    build:
      context: .
      dockerfile: Dockerfile.dedup
    image: colibri/trace-dedup:latest
    container_name: trace-dedup
    profiles: ["dedup"]
    restart: "no"

    logging:
      driver: loki
      options:
        loki-url: "http://193.26.158.2:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-external-labels: "chain=mainnet,type=trace-dedup"

    environment:
      DATA_DIR: "/data/traces"
      # Sibling of the hash shards; walkBuckets ignores non-[0-9a-f]{2} names.
      OUT: "/data/traces/train"
      CAP: "5"

    volumes:
      - /srv/trace-data:/data/traces

    mem_limit: 1g
